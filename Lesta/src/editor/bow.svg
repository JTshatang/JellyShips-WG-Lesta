    <path d="M-30 -74L-23 -77H23L30 -74V-70H-30Z" fill="#a5adb0"/>
    <!-- 前部主炮，三个炮口面对观察者 -->
    <path d="M-34 -49L-28 -62L-21 -66H21L28 -62L34 -49V-39H-34Z" fill="#59656b"/>
    <path d="M-34 -49L-24 -59H24L34 -49Z" fill="#b5bdbe"/>
    <path d="M-24 -59H24L30 -49H-30Z" fill="#879296"/>
    <g fill="#3c484f" stroke="#b0b9bb" stroke-width="2">
      <circle cx="-14" cy="-53" r="4.3"/><circle cx="0" cy="-53" r="4.3"/><circle cx="14" cy="-53" r="4.3"/>
    </g>
    <!-- 两舷沿甲板向中间上扬，在舰艏棱线交会。 -->
