    <path d="M-2 -144H2V-96H-2Z M-22 -131H22V-128H-22Z M-11 -139H11V-137H-11Z" fill="#48545b"/>
    <path d="M-12 -101L0 -129L12 -101 M-19 -104L0 -124L19 -104" fill="none" stroke="#68757b" stroke-width="2"/>
    <path d="M-11 -112H11V-105H-11Z M-16 -109H16V-106H-16Z" fill="#48545b"/>
    <!-- 阶梯舰桥、投影面及观察窗 -->
    <path d="M-31 -45L-26 -77H-17V-99L-13 -104H13L17 -99V-77H26L31 -45Z" fill="#849094"/>
    <path d="M0 -104H13L17 -99V-77H26L31 -45H0Z" fill="#6d797e"/>
    <path d="M-22 -99H22V-94H-22Z M-27 -81H27V-77H-27Z" fill="#505c63"/>
